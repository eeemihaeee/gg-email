appId: com.gg.email
productName: GG Email
copyright: © GG Email Team
directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: GG-Email-Setup-${version}.${ext}
  # Установка и обновления не требуют прав администратора.
  requestedExecutionLevel: asInvoker
  legalTrademarks: GG Email

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GG Email
  uninstallDisplayName: GG Email
  deleteAppDataOnUninstall: false
  differentialPackage: true
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: GG-Email-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: GG Email не использует камеру.
    NSMicrophoneUsageDescription: GG Email не использует микрофон.
    LSMinimumSystemVersion: '11.0'

dmg:
  title: GG Email ${version}
  artifactName: GG-Email-${version}-${arch}.${ext}

publish:
  provider: github
  owner: eeemihaeee
  repo: gg-email
  releaseType: release
