appId: com.gg.email
productName: GG Email
copyright: © GG Email Team
directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: GG-Email-Setup-${version}.${ext}
  # Установка и обновления не требуют прав администратора.
  requestedExecutionLevel: asInvoker
  legalTrademarks: GG Email

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GG Email
  uninstallDisplayName: GG Email
  deleteAppDataOnUninstall: false
  differentialPackage: true
  include: build/installer.nsh

publish:
  provider: github
  owner: eeemihaeee
  repo: gg-email
  releaseType: release
