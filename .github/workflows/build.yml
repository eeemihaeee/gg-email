name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build

      # macOS пока без сертификата: identity: null в electron-builder.yml.
      # Публикация всех платформ — отдельным job, чтобы не плодить релизы.
      - name: Build macOS (x64 + arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gg-email-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  windows:
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      ROOT_CERT_BASE64: ${{ secrets.ROOT_CERT_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Setup Java for GreenMail
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Integration tests (IMAP/SMTP, GreenMail)
        env:
          GGEMAIL_IT: '1'
        run: npm run test:integration

      - name: Check ADMX is up to date
        run: |
          npm run admx
          git diff --exit-code policy

      - name: Build application
        run: npm run build

      - name: Trust internal code-signing root (CI)
        if: env.ROOT_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'gg-email-root.cer'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:ROOT_CERT_BASE64))
          Import-Certificate -FilePath $path -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Write-Host 'Внутренний корневой сертификат установлен на раннере'

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify code signature
        if: env.CSC_LINK != ''
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter 'GG-Email-Setup-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $file.FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Подпись недействительна: $($sig.StatusMessage)" }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Filter '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gg-email-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Remove releases with this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"; done || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest.yml
            dist/latest-mac.yml
            dist/SHA256SUMS.txt
