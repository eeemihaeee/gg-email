name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build

      # macOS пока без сертификата: identity: null в electron-builder.yml.
      - name: Build and publish macOS (x64 + arm64)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish always

      - name: Build macOS (pull request, без публикации)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never

      - name: Upload macOS artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gg-email-macos
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  windows:
    needs: macos
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Setup Java for GreenMail
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Integration tests (IMAP/SMTP, GreenMail)
        env:
          GGEMAIL_IT: '1'
        run: npm run test:integration

      - name: Check ADMX is up to date
        run: |
          npm run admx
          git diff --exit-code policy

      - name: Build application
        run: npm run build

      # Конфиг Azure Trusted Signing генерируется из секретов, чтобы не
      # хранить имена аккаунтов в репозитории и не ломать сборку без ключей.
      - name: Prepare Azure Trusted Signing config
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          @"
          extends: ./electron-builder.yml
          win:
            azureSignOptions:
              publisherName: "$env:AZURE_PUBLISHER_NAME"
              endpoint: "$env:AZURE_ENDPOINT"
              codeSigningAccountName: "$env:AZURE_SIGNING_ACCOUNT"
              certificateProfileName: "$env:AZURE_CERT_PROFILE"
          "@ | Set-Content electron-builder.azure.yml -Encoding utf8
          Get-Content electron-builder.azure.yml

      - name: Build and publish installer
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = if ($env:AZURE_CLIENT_ID) { 'electron-builder.azure.yml' } else { 'electron-builder.yml' }
          npx electron-builder --config $config --win nsis --x64 --publish always

      - name: Verify code signature
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $file = Get-ChildItem release -Filter 'GG-Email-Setup-*.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $file.FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "Подпись недействительна: $($sig.StatusMessage)" }

      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -Include '*.exe' -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gg-email-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
